[problem]
dt = 0.1
horizon = 50
simulation_steps = 360
nominal_profile = "minimum_jerk"
initial_state = [-8.5, -9.0, 0.0, 0.0]
goal = [8.5, 9.0]

# Wide cluttered circular-obstacle navigation benchmark inspired by common MPPI
# demos.  Obstacles are distributed over a roughly [-10,10]^2 field so that the
# receding-horizon controller should weave between them from lower-left to
# upper-right, not take a single outer detour around a compact obstacle cluster.
obstacle_centers = [
  [-7.70, -0.80],
  [-7.20, -6.40],
  [-6.25, 3.25],
  [-4.85, 1.15],
  [-3.55, 7.25],
  [-2.55, 5.30],
  [-1.85, 1.45],
  [-1.25, -2.05],
  [0.95, 1.45],
  [2.95, -6.20],
  [3.65, 4.80],
  [4.45, 2.35],
  [3.95, -0.75],
  [5.50, -3.75],
]
obstacle_radii = [
  0.90, 1.05, 0.95, 0.90, 0.90, 1.05, 0.95,
  0.95, 1.05, 0.95, 0.90, 0.90, 0.95, 1.05,
]
safety_margin = 0.10
hard_obstacles = true

q_goal_running = 0.015
q_goal_terminal = 80.0
q_velocity_running = 0.02
q_velocity_terminal = 20.0
q_control = 0.005
q_control_rate = 0.03
q_obstacle = 0.0
u_max = 2.5

[mppi]
tau = 100.0
noise_sigma = 0.45
noise_correlation = 0.9

[cbo]
alpha = 0.02
lambda = 1.0
sigma = 0.12
delta_s = 0.2
init_sigma = 2.5
init_noise_correlation = 0.9
warm_start = { mode = "shift_jitter", jitter_kind = "smooth", sigma = 0.50, apply_to = "all_particles", refresh_rate = 0.0, min_cov_trace = 0.0 }

[proposed]
tau = 100.0
local_noise_sigma = 0.45
local_noise_correlation = 0.9
alpha = 0.02
lambda = 1.0
sigma = 0.12
delta_s = 0.2
init_sigma = 2.5
init_noise_correlation = 0.9
output_rule = "weighted"
shared_local_noise = true
eta_grad = 0.25
grad_clip = 0.0
warm_start = { mode = "shift_jitter", jitter_kind = "smooth", sigma = 0.50, apply_to = "all_particles", refresh_rate = 0.0, min_cov_trace = 0.0 }
